# /etc/nginx/conf.d/orbita.conf
server {
    listen 80;

    location /tts {
        proxy_pass http://127.0.0.1:5000/;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_read_timeout 300s;
        # Optional login (create the file with: sudo htpasswd -c /etc/nginx/.htpasswd YOUR_USER)
        # auth_basic "Orbita_Ai";
        # auth_basic_user_file /etc/nginx/.htpasswd;
    }
}
